<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Half football pitch, vertical">
  <!-- Pitch stripes (alternating light/dark green) -->
  <defs>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50"></stop>
      <stop offset="100%" stop-color="#43A047"></stop>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="#4CAF50"></rect>
  <!-- vertical stripes across the pitch -->
  <g>
    <rect x="0" y="0" width="200" height="1000" fill="url(#stripe)" opacity="0.5"></rect>
    <rect x="400" y="0" width="200" height="1000" fill="url(#stripe)" opacity="0.5"></rect>
    <rect x="800" y="0" width="200" height="1000" fill="url(#stripe)" opacity="0.5"></rect>
    <rect x="1200" y="0" width="200" height="1000" fill="url(#stripe)" opacity="0.5"></rect>
  </g>

  <!-- Pitch border -->
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#ffffff" stroke-width="8"></rect>

  <!-- Top goal -->
  <rect x="735" y="-40" width="130" height="40" fill="none" stroke="#ffffff" stroke-width="8"></rect>

  <!-- Penalty area -->
  <rect x="550" y="20" width="500" height="300" fill="none" stroke="#ffffff" stroke-width="8"></rect>

  <!-- Goal area -->
  <rect x="660" y="20" width="280" height="100" fill="none" stroke="#ffffff" stroke-width="8"></rect>

  <!-- Penalty spot -->
  <circle cx="800" cy="200" r="10" fill="#ffffff"></circle>

  <!-- Penalty arc -->
  <defs>
    <clipPath id="outsidePenalty">
      <rect x="0" y="320" width="1600" height="680"></rect>
    </clipPath>
  </defs>
  <circle cx="800" cy="200" r="165" fill="none" stroke="#ffffff" stroke-width="8" clip-path="url(#outsidePenalty)"></circle>

  <!-- Halfway line -->
  <line x1="20" y1="980" x2="1580" y2="980" stroke="#ffffff" stroke-width="8"></line>

  <!-- Half center circle -->
  <defs>
    <clipPath id="insidePitch">
      <rect x="0" y="0" width="1600" height="1000"></rect>
    </clipPath>
  </defs>
  <circle cx="800" cy="980" r="165" fill="none" stroke="#ffffff" stroke-width="8" clip-path="url(#insidePitch)"></circle>

  <!-- Center mark -->
  <circle cx="800" cy="980" r="10" fill="#ffffff"></circle>
</svg>
